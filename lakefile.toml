name = "Erdos289"
version = "0.1.0"
defaultTargets = ["Erdos289"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
# The two audited files (Erdos289/Intervals.lean, Erdos289/ExternalAxioms.lean) are immutable
# and trip these two cosmetic linters; they are disabled package-wide for that reason.
linter.unusedSimpArgs = false
linter.defProp = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.0-rc2"

[[lean_lib]]
name = "Erdos289"

# Verbatim ports of axiom-clean proofs of classical inputs (see Erdos289/Ported.lean and
# expert_input/ported/*/PROVENANCE.md for provenance).
[[lean_lib]]
name = "SolveMath"
# Verbatim third-party ports: do not report deprecations/lints we will not fix in place.
leanOptions = { linter.deprecated = false, linter.unusedSimpArgs = false, linter.style.haveILetI = false, linter.unusedVariables = false, linter.defProp = false, linter.unnecessarySimpa = false, linter.unusedTactic = false, linter.unnecessarySeqFocus = false }

# Verbatim port of the Conlon–Fox–Pham structure theorem from plby/lean-proofs (Apache-2.0);
# see ErdosProblems/PROVENANCE.md.
[[lean_lib]]
name = "ErdosProblems"
leanOptions = { linter.deprecated = false, linter.unusedSimpArgs = false, linter.style.haveILetI = false, linter.unusedVariables = false, linter.defProp = false, linter.unnecessarySimpa = false, linter.unusedTactic = false, linter.unnecessarySeqFocus = false }
